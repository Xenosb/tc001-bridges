CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=6144

# Display: drawn directly into a framebuffer (see src/gfx.c)
CONFIG_DISPLAY=y

# Buttons
CONFIG_INPUT=y

# Battery voltage and the light sensor
CONFIG_ADC=y

# Time: NTP over Wi-Fi, kept in the battery-backed DS1307 for the next boot
CONFIG_SNTP=y
CONFIG_NET_UDP=y
CONFIG_RTC=y

# Network: Wi-Fi station querying GitHub, crates.io and NuGet over HTTPS, plus a setup
# access point (with DHCP server and web page) when no saved network works
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
# Sockets that were just closed keep their slot for a moment (TCP TIME_WAIT), and the clock opens
# several in quick succession (NTP, location, weather, then the four stats requests)
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16

# Saved networks live in flash (settings on NVS, "storage" partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_MAX_ENTRIES=8

# Setup web page
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=512
CONFIG_HTTP_SERVER_STACK_SIZE=6144
CONFIG_REBOOT=y

# TLS 1.2 client with certificate verification against the embedded roots.
# GitHub sends its ~7 KB answer in one TLS record, hence the 8 KB input buffer.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=45000
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=8192
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=1024
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_TLS_CREDENTIALS=y
# One slot per trusted root certificate (see certs/README.md)
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=8
# crates.io and NuGet sit behind shared CDN/cloud addresses that pick the certificate by SNI
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
# GitHub's chain is anchored by the P-384 USERTrust ECC root
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y
